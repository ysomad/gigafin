{{define "content"}}
<article style="max-width: 24rem; margin: 2rem auto;">
  <h1>{{t "Sign in"}}</h1>
  <form method="post" action="/login">
    <label>{{t "Login"}} <input name="login" autocomplete="username" value="{{.Data.Login}}" required autofocus></label>
    <label>{{t "Password"}} <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">{{t "Sign in"}}</button>
  </form>
</article>
{{end}}
