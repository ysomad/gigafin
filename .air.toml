root = "."
tmp_dir = "bin/tmp"

[build]
cmd = "go tool templ generate -path internal/ui && make build-app migrate-up && ./bin/fw-allow.sh"
entrypoint = ["./bin/gigafin"]
include_ext = ["go", "templ", "css", "js", "sql", "yaml"]
exclude_dir = ["bin", ".playwright-mcp", "internal/gen"]
exclude_regex = ["_test\\.go$", "_templ\\.go$"]
delay = 300
kill_delay = "2s"
send_interrupt = true

[log]
main_only = true

[misc]
clean_on_exit = true
