root = "."
tmp_dir = "bin/tmp"

[build]
cmd = "make build migrate-up && ./bin/fw-allow.sh"
entrypoint = ["./bin/gigafin", "serve"]
include_ext = ["go", "html", "css", "js", "sql", "yaml"]
exclude_dir = ["bin", ".playwright-mcp", "internal/gen"]
exclude_regex = ["_test\\.go$"]
delay = 300
kill_delay = "2s"
send_interrupt = true

[log]
main_only = true

[misc]
clean_on_exit = true
